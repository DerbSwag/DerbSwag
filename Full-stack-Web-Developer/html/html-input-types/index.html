<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
  </head>
  <body>
    <div>
      <label for="text">Text Input:</label>
      <input type="text" id="text" name="text" />
    </div>

    <div>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" />
    </div>

    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" />
    </div>

    <div>
      <label for="url">URL:</label>
      <input type="url" id="url" name="url" />
    </div>

    <div>
      <label for="tel">Telephone:</label>
      <input type="tel" id="tel" name="tel" />
    </div>

    <div>
      <label for="search">Search:</label>
      <input type="search" id="search" name="search" />
    </div>

    <div>
      <label for="color">Color:</label>
      <input type="color" id="color" name="color" value="#ff0000" />
    </div>

    <div>
      <label for="number">Number:</label>
      <input
        type="number"
        id="number"
        name="number"
        min="1"
        max="10"
        step="1"
      />
    </div>

    <div>
      <label for="range">Range:</label>
      <input
        type="range"
        id="range"
        name="range"
        min="0"
        max="100"
        step="1"
        value="50"
      />
    </div>

    <div>
      <label for="date">Date:</label>
      <input
        type="date"
        id="date"
        name="date"
        min="2024-01-01"
        max="2024-12-31"
      />
    </div>

    <div>
      <label for="month">Month:</label>
      <input type="month" id="month" name="month" min="2024-01" max="2024-12" />
    </div>

    <div>
      <label for="week">Week:</label>
      <input type="week" id="week" name="week" min="2024-W01" max="2024-W52" />
    </div>

    <div>
      <label for="time">Time:</label>
      <input type="time" id="time" name="time" min="08:00" max="18:00" />
    </div>

    <div>
      <label for="datetime-local">Datetime Local:</label>
      <input
        type="datetime-local"
        id="datetime-local"
        name="datetime-local"
        min="2024-01-01T08:00"
        max="2024-12-31T18:00"
      />
    </div>

    <div>
      <label for="file">File:</label>
      <input type="file" id="file" name="file" />
    </div>

    <div>
      <label for="hidden">Hidden Input:</label>
      <input
        type="hidden"
        id="hidden"
        name="hidden"
        value="some hidden value"
      />
    </div>

    <div>
      <label for="datetime">Datetime:</label>
      <input type="datetime" id="datetime" name="datetime" />
    </div>

    <div>
      <label for="comments">Comments:</label>
      <textarea
        id="comments"
        name="comments"
        rows="5"
        cols="40"
        placeholder="Enter your comments here..."
      ></textarea>
    </div>
  </body>
</html>
