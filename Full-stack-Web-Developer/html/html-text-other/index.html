<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <style>
      .with-styles {
        * {
          display: inline-block;
          margin-bottom: 0.3em;
        }
        code {
          background-color: #f4f4f4;
          color: #d63384;
          font-family: 'Courier New', monospace;
          padding: 4px 8px;
          border-radius: 4px;
          border: 1px solid #e2e2e2;
        }
        kbd {
          background-color: #333;
          color: #fff;
          font-family: 'Arial', sans-serif;
          padding: 4px 6px;
          border-radius: 4px;
          border: 1px solid #444;
          box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        samp {
          background: linear-gradient(90deg, #ffafbd, #ffc3a0);
          color: #333;
          padding: 6px 10px;
          border-radius: 6px;
          font-family: 'Courier New', monospace;
        }
        var {
          color: #007bff;
          font-style: italic;
          font-weight: bold;
          background-color: #e8f5ff;
          padding: 3px 6px;
          border-radius: 3px;
          border: 1px dashed #007bff;
        }
      }
    </style>
  </head>

  <body>
    x<sup>2</sup><br />
    H<sub>2</sub>0<br />
    <abbr title="HyperText Markup Language">HTML</abbr><br />

    <hr />

    <code>Code</code><br />
    <kbd>Keyboard Input</kbd><br />
    <samp>Sample Text</samp><br />
    <var>Variable</var>

    <hr />

    <section class="with-styles">
      <code>Code</code><br />
      <kbd>Keyboard Input</kbd><br />
      <samp>Sample Text</samp><br />
      <var>Variable</var>
    </section>
  </body>
</html>
