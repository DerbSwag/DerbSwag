<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
  </head>
  <body>
    <!-- 
      <table> = ตารางหลัก
      <caption> = ชื่อตาราง (ไม่จำเป็น)
      <thead> = Table Head (ไม่จำเป็น)
      <tbody> = Table Body
      <tfoot> = Table Foot (ไม่จำเป็น)
      <tr> = Table Row (แถว; แนวนอน)
      <td> = Table Cell (เซลล์ ตามจำนวนคอลัมน์; แนวตั้ง)
      <th> = Table Head Cell (เซลล์เหมือนกับ td แต่บ่งบอกว่ามีความสำคัญกว่า)
      [rowspan] = ขยาย Row (แนวตั้ง)
      [colspan] = ขยาย Column (แนวนอน)
    -->

    <table border="1">
      <tbody>
        <tr>
          <td>Cell 1</td>
          <td>Cell 2</td>
          <td>Cell 3</td>
        </tr>
        <tr>
          <td>Cell 4</td>
          <td>Cell 5</td>
          <td>Cell 6</td>
        </tr>
        <tr>
          <td>Cell 7</td>
          <td>Cell 8</td>
          <td>Cell 9</td>
        </tr>
      </tbody>
    </table>

    <hr />

    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>John Doe</td>
          <td>28</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Jane Smith</td>
          <td>34</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Michael Brown</td>
          <td>22</td>
        </tr>
        <tr>
          <td>4</td>
          <td>Emily Davis</td>
          <td>30</td>
        </tr>
      </tbody>
    </table>

    <hr />

    <table border="1">
      <caption>
        ตารางแสดงข้อมูลสมาชิก
      </caption>
      <thead>
        <tr>
          <th rowspan="2">ชื่อ-สกุล</th>
          <th colspan="2">ที่อยู่</th>
          <!-- ที่อยู่ -->
          <th rowspan="2">เบอร์โทรศัพท์</th>
        </tr>
        <tr>
          <!-- ชื่อ-สกุล -->
          <th>จังหวัด</th>
          <th>อำเภอ</th>
          <!-- เบอร์โทรศัพท์ -->
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>นายสมชาย</td>
          <td>กรุงเทพฯ</td>
          <td>บางเขน</td>
          <td>081-1234567</td>
        </tr>
        <tr>
          <td>นางสาวสมพร</td>
          <td>เชียงใหม่</td>
          <td>สันทราย</td>
          <td>061-1234567</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="4">รวม 2 คน</td>
          <!-- รวม 2 คน -->
          <!-- รวม 2 คน -->
          <!-- รวม 2 คน -->
        </tr>
      </tfoot>
    </table>
  </body>
</html>
